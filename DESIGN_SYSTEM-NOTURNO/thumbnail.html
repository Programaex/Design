<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nocturne — thumbnail</title>
<link rel="stylesheet" href="styles.css" />
<style>
/* Thumbnail (1280×854): brand mark left on the black scene, ramp strip right. */
html, body { height: 100%; }
body { margin: 0; display: flex; background: var(--color-bg); }
.mark { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-6); padding: 64px; overflow: hidden; }
.mark h1 {
  margin: 0; color: var(--color-text); font-size: 150px;
  line-height: 0.98; letter-spacing: -0.03em; white-space: nowrap;
}
.mark .pill { align-self: flex-start; font-size: 28px; padding: var(--space-3) var(--space-8); }
.strip { width: 22%; display: flex; flex-direction: column; }
.strip i { flex: 1; }
</style>
</head>
<body>
<div class="mark"><button type="button" class="btn btn-primary pill">Design system</button><h1>Nocturne</h1></div>
<aside class="strip"><i style="background: var(--color-accent-400)"></i><i style="background: var(--color-accent-600)"></i><i style="background: var(--color-accent-800)"></i><i style="background: var(--color-neutral-300)"></i><i style="background: var(--color-neutral-800)"></i></aside>
</body>
</html>
