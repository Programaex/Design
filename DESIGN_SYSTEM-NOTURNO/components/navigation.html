<!-- @dsCard group="Components" name="Navigation" subtitle="The 44px translucent bar over a centred page opening" viewport="640x420" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nocturne — Navigation</title>
<link rel="stylesheet" href="../styles.css" />
<style>
/* Demo scaffolding only — everything visual comes from ../styles.css. */
.demo { max-width: 620px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.demo-head {
  font-family: var(--font-body); font-size: var(--text-micro); font-weight: 600;
  letter-spacing: -0.01em; color: var(--color-text-muted);
  margin: var(--space-6) 0 var(--space-3);
}
.demo-head:first-child { margin-top: 0; }
.row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.stack { display: grid; gap: var(--space-3); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
.note { font-size: var(--text-micro); line-height: 1.4; color: var(--color-text-muted); max-width: 60ch; margin: var(--space-4) 0 0; }
code { font-family: var(--font-mono); font-size: 0.92em; letter-spacing: 0; }
.demo { max-width: none; padding: 0; }
.page { padding: var(--space-6) var(--space-4) var(--space-8); max-width: 620px; margin: 0 auto; }
.hero { text-align: center; padding-top: var(--space-12); }
.hero h1 { margin-bottom: var(--space-3); }
.hero .row { justify-content: center; }
.hero p { margin-inline: auto; max-width: 44ch; color: var(--color-text-muted); font-size: var(--text-card); line-height: 1.19; }

</style>
</head>
<body>
<main class="demo">
<nav class="nav">
    <span class="nav-brand">Nocturne</span>
    <a href="#" aria-current="page">Overview</a>
    <a href="#">Components</a>
    <a href="#">Tokens</a>
    <button type="button" class="btn btn-primary">Get started</button>
  </nav>
  <div class="page hero">
    <h1>Everything inherits the theme.</h1>
    <p>The header, this opening, the buttons and the copy are ordinary HTML styled only by styles.css — change the tokens and all of it follows.</p>
    <div class="row">
      <button type="button" class="btn btn-primary">Primary action</button>
      <button type="button" class="btn btn-ghost">Learn more<svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66A8,8,0,0,1,101.66,42.34l80,80A8,8,0,0,1,181.66,133.66Z"/></svg></button>
    </div>
  </div>
</main>
</body>
</html>
