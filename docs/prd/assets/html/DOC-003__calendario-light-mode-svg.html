<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendário Light Mode — SVG editável</title>
<style>
:root{--bg:#F2F2EF;--ink:#111111;--red:#E31919;--line:#D8D8D5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.figure{width:min(100%,1440px);background:#FFFFFF;border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.12)}
.figure svg{display:block;width:100%;height:auto}
.toolbar{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{appearance:none;border:1px solid var(--ink);background:#FFFFFF;color:var(--ink);padding:10px 14px;font:700 13px/1 Helvetica,Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:#FFFFFF}
@media print{body{background:#FFFFFF}main{padding:0}.figure{width:100%;border:0;box-shadow:none}.toolbar{display:none}}
</style>
</head>
