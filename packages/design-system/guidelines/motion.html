<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div class="row" style="align-items:center;gap:24px"><div class="card card-interactive" style="width:200px;padding:16px"><div class="card-kicker">Hover me</div><div class="card-title" style="font-size:17px">scale(1.01)</div></div><code style="color:var(--color-text-muted);line-height:1.6">--duration-fast 160ms · --duration-base 240ms<br>--ease-standard cubic-bezier(.25,.1,.25,1)<br>no bounces · prefers-reduced-motion respected</code></div></body></html>
