<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Nearly flat — edge, then ambient shadow; never stacked" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div class="row" style="gap:24px;padding:8px"><div style="width:180px;height:84px;border-radius:18px;background:var(--color-bg);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:12px;color:var(--color-text-muted)"><code>shadow-sm</code></div><div style="width:180px;height:84px;border-radius:18px;background:var(--color-bg);box-shadow:var(--shadow-md);display:grid;place-items:center;font-size:12px;color:var(--color-text-muted)"><code>shadow-md</code></div><div style="width:180px;height:84px;border-radius:18px;background:var(--color-bg);box-shadow:var(--shadow-lg);display:grid;place-items:center;font-size:12px;color:var(--color-text-muted)"><code>shadow-lg</code></div></div></body></html>
