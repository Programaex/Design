<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div style="text-align:center;padding:16px 0 20px"><div style="font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1">Atenção sustentada.</div><div style="font-size:19px;color:var(--color-text-muted);margin-top:12px">Um headline, uma linha de apoio, as ações.</div><div style="display:flex;gap:16px;justify-content:center;margin-top:20px"><button class="btn btn-primary">Explorar</button><button class="btn btn-ghost">Saiba mais ›</button></div></div><div style="background:var(--color-section);color:var(--color-on-section);text-align:center;padding:24px;border-radius:0;font-size:13px">↕ var(--layout-band) clamp(64px, 10vw, 112px) — então a próxima cena</div></body></html>
