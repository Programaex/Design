<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--color-divider)"><div style="padding:28px 16px;text-align:center;background:#fff"><div style="font-family:var(--font-heading);font-weight:600;font-size:21px">Página</div><div style="font-size:12px;color:var(--color-text-muted)">--color-bg</div></div><div style="padding:28px 16px;text-align:center;background:var(--color-section);color:var(--color-on-section)"><div style="font-family:var(--font-heading);font-weight:600;font-size:21px">Faixa inversa</div><div style="font-size:12px;opacity:.64">--color-section</div></div><div style="padding:28px 16px;text-align:center;background:var(--color-surface)"><div style="font-family:var(--font-heading);font-weight:600;font-size:21px">Tile</div><div style="font-size:12px;color:var(--color-text-muted)">--color-surface</div></div></div></body></html>
