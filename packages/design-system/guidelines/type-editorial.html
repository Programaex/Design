<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:28px 32px;font-family:var(--font-body);color:var(--color-text);background:var(--color-bg)}.e{font-family:var(--font-heading);font-weight:600;font-size:var(--text-eyebrow);line-height:var(--leading-eyebrow)}.d{font-family:var(--font-heading);font-weight:600;font-size:56px;line-height:var(--leading-hero);letter-spacing:var(--tracking-display);margin:4px 0 12px}.l{font-size:var(--text-lead);line-height:var(--leading-lead);color:var(--color-text-muted);max-width:56ch;margin:0}.l b{font-weight:400;color:var(--text-highlight)}.s{display:flex;gap:40px;margin-top:20px}.s b{display:block;font-family:var(--font-heading);font-weight:600;font-size:var(--text-stat);line-height:var(--leading-stat)}.s span{font-size:var(--text-stat-caption)}code{font:11px var(--font-mono);color:var(--color-text-muted)}</style></head><body>
<div class="e">Lorem ipsum</div><div class="d">Lorem ipsum dolor.</div>
<p class="l">Lorem ipsum dolor sit amet, <b>consectetur adipiscing elit</b>, sed do eiusmod tempor incididunt ut labore.</p>
<div class="s"><div><b>3.000</b><span>--text-stat / caption</span></div><div><b>8</b><span>icon + number</span></div></div>
<code>--text-eyebrow 28 · display 56–80 · --text-lead 21/1.38 muted + .hl · --text-stat 64</code>
</body></html>
