<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}.sw{width:62px}</style></head><body><div class="row"><div class="sw"><b style="background:var(--color-neutral-100)"></b><span>100</span><code>#f5f5f7</code></div><div class="sw"><b style="background:var(--color-neutral-200)"></b><span>200</span><code>#e8e8ed</code></div><div class="sw"><b style="background:var(--color-neutral-300)"></b><span>300</span><code>#d2d2d7</code></div><div class="sw"><b style="background:var(--color-neutral-400)"></b><span>400</span><code>#a1a1a6</code></div><div class="sw"><b style="background:var(--color-neutral-500)"></b><span>500</span><code>#86868b</code></div><div class="sw"><b style="background:var(--color-neutral-600)"></b><span>600</span><code>#6e6e73</code></div><div class="sw"><b style="background:var(--color-neutral-700)"></b><span>700</span><code>#424245</code></div><div class="sw"><b style="background:var(--color-neutral-800)"></b><span>800</span><code>#333336</code></div><div class="sw"><b style="background:var(--color-neutral-900)"></b><span>900</span><code>#1d1d1f</code></div></div></body></html>
