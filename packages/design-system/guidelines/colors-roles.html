<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div class="row"><div class="sw"><b style="background:var(--color-bg)"></b><span>bg</span><code>#ffffff</code></div><div class="sw"><b style="background:var(--color-surface)"></b><span>surface</span><code>#f5f5f7</code></div><div class="sw"><b style="background:var(--color-text)"></b><span>text</span><code>#1d1d1f</code></div><div class="sw"><b style="background:var(--color-text-muted)"></b><span>text-muted</span><code>#6e6e73</code></div><div class="sw"><b style="background:var(--color-accent)"></b><span>accent</span><code>#0071e3</code></div><div class="sw"><b style="background:var(--color-link)"></b><span>link</span><code>#0066cc</code></div><div class="sw"><b style="background:var(--color-section)"></b><span>section</span><code>#000000</code></div></div></body></html>
