<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div class="row"><div class="sw"><b style="background:var(--color-success)"></b><span>success</span><code>#248a3d</code></div><div class="sw"><b style="background:var(--color-warning)"></b><span>warning</span><code>#b25000</code></div><div class="sw"><b style="background:var(--color-danger)"></b><span>danger</span><code>#d70015</code></div></div><div class="row" style="margin-top:14px"><span class="tag tag-success">Baixo risco</span><span class="tag tag-warning">Atenção</span><span class="tag tag-danger">Risco alto</span></div></body></html>
