<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}</style></head><body><div class="row" style="align-items:flex-end;gap:20px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-1);height:var(--space-1);background:var(--color-accent-200);border-radius:2px"></b><code>space-1</code>4px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-2);height:var(--space-2);background:var(--color-accent-200);border-radius:2px"></b><code>space-2</code>8px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-3);height:var(--space-3);background:var(--color-accent-200);border-radius:2px"></b><code>space-3</code>12px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-4);height:var(--space-4);background:var(--color-accent-200);border-radius:2px"></b><code>space-4</code>16px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-6);height:var(--space-6);background:var(--color-accent-200);border-radius:2px"></b><code>space-6</code>24px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-8);height:var(--space-8);background:var(--color-accent-200);border-radius:2px"></b><code>space-8</code>32px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-12);height:var(--space-12);background:var(--color-accent-200);border-radius:2px"></b><code>space-12</code>48px</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--color-text-muted)"><b style="display:block;width:var(--space-16);height:var(--space-16);background:var(--color-accent-200);border-radius:2px"></b><code>space-16</code>64px</div></div></body></html>
