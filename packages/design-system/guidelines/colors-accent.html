<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px;font-size:11px;line-height:1.3;color:var(--color-text-muted);letter-spacing:-0.01em}.sw b{display:block;height:56px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.sw span{color:var(--color-text);font-weight:500}code{font-family:var(--font-mono);font-size:11px;letter-spacing:0}.sw{width:62px}</style></head><body><div class="row"><div class="sw"><b style="background:var(--color-accent-100)"></b><span>100</span><code>#eff7ff</code></div><div class="sw"><b style="background:var(--color-accent-200)"></b><span>200</span><code>#cfe6ff</code></div><div class="sw"><b style="background:var(--color-accent-300)"></b><span>300</span><code>#94c8ff</code></div><div class="sw"><b style="background:var(--color-accent-400)"></b><span>400</span><code>#2997ff</code></div><div class="sw"><b style="background:var(--color-accent-500)"></b><span>500</span><code>#1784f1</code></div><div class="sw"><b style="background:var(--color-accent-600)"></b><span>600 · fill</span><code>#0071e3</code></div><div class="sw"><b style="background:var(--color-accent-700)"></b><span>700 · link</span><code>#0066cc</code></div><div class="sw"><b style="background:var(--color-accent-800)"></b><span>800</span><code>#003a77</code></div><div class="sw"><b style="background:var(--color-accent-900)"></b><span>900</span><code>#001d3d</code></div></div></body></html>
